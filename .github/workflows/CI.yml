name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: 24.x

      - name: Linter
        run: npx next typegen && npm run lint

      - name: Build static export
        run: npx next build
